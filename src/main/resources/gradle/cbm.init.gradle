import groovy.json.JsonSlurper

// Composite Build Manager (CBM) - Auto-generated by CBM plugin, do not edit manually.

gradle.settingsEvaluated { settings ->
    File stateFile = new File(settings.rootDir, ".idea/cbm/modules.json")

    if (!stateFile.exists()) return

    try {
        def cbm = new JsonSlurper().parse(stateFile)
        def modules = cbm.modules
        if (!(modules instanceof List)) {
            println "[WARN] CBM: 'modules' 字段缺失或格式错误"
            return
        }

        println "[CBM] modules=${modules.size()}"

        modules.each { mod ->
            def modDir = mod.path ? new File(mod.path as String) : new File(settings.rootDir, "../${mod.name}_project")
            def modPath = modDir.absolutePath
            if (!modDir.exists()) {
                println "[WARN] CBM skipped: ${mod.name} not found at ${modPath}"
                return
            }
            if (mod.substitutions instanceof List && !mod.substitutions.isEmpty()) {
                // 显式映射优先，支持任意深度 project path
                def rules = mod.substitutions.collect { rule ->
                    def requested = (rule.module ?: "") as String
                    def target = (rule.project ?: "") as String
                    if (!(requested ==~ /^[\w.-]+:[\w.-]+$/) || !target.startsWith(":")) return null
                    [module: requested, project: target]
                }.findAll { it != null }
                settings.includeBuild(modPath) {
                    dependencySubstitution {
                        rules.each { rule ->
                            substitute module(rule.module) using project(rule.project)
                        }
                    }
                }
                println "[CBM] includeBuild (explicit substitutions=${rules.size()}): ${mod.name} -> ${modPath}"
            } else if (mod.deps) {
                // 自定义组件：按 deps 字段做精确 dependencySubstitution
                // deps 格式：compact list，如 "com.example:lib=:lib|com.example:core=:core"
                def subRules = (mod.deps as String).split("\\|").collectEntries { entry ->
                    def idx = entry.indexOf('=')
                    idx >= 0 ? [(entry.substring(0, idx).trim()): entry.substring(idx + 1).trim()] : [:]
                }
                settings.includeBuild(modPath) {
                    dependencySubstitution {
                        subRules.each { dep, proj ->
                            def parts = dep.split(":")
                            if (parts.size() == 2 && dep ==~ /^[\w.-]+:[\w.-]+$/) {
                                substitute module("${parts[0]}:${parts[1]}") using project(proj)
                            }
                        }
                    }
                }
                println "[CBM] includeBuild (deps substitution): ${mod.name} -> ${modPath}"
            } else {
                settings.includeBuild(modPath)
                println "[CBM] includeBuild: ${mod.name} -> ${modPath}"
            }
        }
    } catch (Exception e) {
        println "[WARN] CBM: Failed to parse state file: ${e.message}"
    }
}
